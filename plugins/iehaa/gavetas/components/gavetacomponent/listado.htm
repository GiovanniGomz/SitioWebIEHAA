<div class="contenedor-archiveros {% if gavetas|length == 0 %} d-block text-center {% endif %}">

    {% for gaveta in gavetas %}

    <div class="archivero">
        <i class="bi bi-archive btnRedireccionar" data-id="{{ gaveta.url }}"></i>

        <span>Gaveta No. {{ gaveta.codigo }}</span>

        <div class="archivero-botonera">
            <button class="boton boton-modificar" data-bs-toggle="modal" data-bs-target="#modal"
                data-request="gavetaComponent::onGetGaveta" data-request-data="id: {{ gaveta.id }}"
                data-request-success="cargarFormulario(data)">
                <i class="bi bi-pencil-square"></i>
            </button>

            <button type="button" class="boton boton-eliminar" data-id="{{ gaveta.id }}">
                <i class="bi bi-trash"></i>
            </button>
        </div>
    </div>

    {% else %}

    <p class="mensaje">No hay registros disponibles</p>

    {% endfor %}
</div>
