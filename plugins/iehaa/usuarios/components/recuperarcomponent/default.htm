<div class="auth-card">
    <div class="auth-brand">
        <img src="{{ 'assets/img/universidad.png'|theme }}" alt="Universidad de El Salvador" />
        <p class="auth-org">Universidad de El Salvador</p>
        <p class="auth-name">Instituto de Estudios Históricos,<br />Antropológicos y Arqueológicos</p>
    </div>

    <hr class="auth-divider" />

    <h2 class="h5 mb-2">¿Olvidaste tu contraseña?</h2>
    <p class="text-muted small mb-3" id="recuperar-instrucciones">
        Ingresá tu correo institucional y te enviaremos un enlace para restablecerla.
    </p>

    <div data-validate-error class="auth-error">
        <p data-message class="mb-0"></p>
    </div>

    <div class="alert alert-success d-none" id="recuperar-exito"></div>

    <form id="formulario-recuperar" data-request="recuperarComponent::onSolicitar" data-request-validate
        data-request-success="onSolicitarExito(data)">
        <div class="mb-4">
            <label for="email" class="form-label">Correo institucional</label>
            <input type="email" class="form-control" id="email" name="email" autocomplete="username" autofocus />
            <span data-validate-for="email" class="text-danger small"></span>
        </div>

        <button type="submit" class="auth-btn" id="btn-recuperar">Enviar enlace</button>
    </form>

    <p class="auth-footer">
        <a href="/login">Volver a iniciar sesión</a>
    </p>
</div>

<script>
    function onSolicitarExito(data) {
        document.getElementById('recuperar-instrucciones').classList.add('d-none');
        document.getElementById('formulario-recuperar').classList.add('d-none');
        var exito = document.getElementById('recuperar-exito');
        exito.textContent = data.mensaje;
        exito.classList.remove('d-none');
    }
</script>
