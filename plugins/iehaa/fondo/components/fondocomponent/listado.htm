<table class="table" id="tabla-documento">
    <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Titulo</th>
            <th scope="col">Archivo</th>
            <th scope="col">Acciones</th>
        </tr>
    </thead>
    <tbody>

        {% set contador = 1 %}
        {% for documento in documentos %}
        <tr>
            <th scope="row">{{ contador }}</th>
            <td>{{ documento.nombre }}</td>
            <td>
                <a type="button" class="btn btn-secondary"
                    href="{{ ('storage/app/uploads/public/fondo/' ~ documento.archivo ) }}"
                    download="{{ documento.nombre }}">
                    Descargar
                </a>
            </td>
            <td>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modal"
                    data-request="fondoComponent::onGetDocumento" data-request-data="id: {{ documento.id }}"
                    data-request-success="cargarFormulario(data)">
                    <i class="bi bi-pencil-square"></i>
                </button>
                <button type="button" class="btn btn-danger btn-eliminar" data-id="{{ documento.id }}">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        </tr>
        {% set contador = contador + 1 %}
        {% endfor %}
    </tbody>
</table>
