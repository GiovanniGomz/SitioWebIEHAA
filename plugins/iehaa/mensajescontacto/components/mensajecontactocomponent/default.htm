<div class="container documento">
    <nav class="submenu-desplazamiento mb-4">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
                <a href="{{ 'cpanel'|page }}">
                    <i class="bi bi-house-door-fill me-1"></i> IEHAA
                </a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">Mensajes de contacto</li>
        </ol>
    </nav>

    <h1>Mensajes de contacto</h1>
    <p class="text-muted">Mensajes escritos por visitantes desde el formulario de contacto de la página pública.</p>

    <section class="botonera">
        <section class="reportes">
            <section class="reporte-pdf">
                <a href="/reportePDFMensajesContacto">
                    <i class="bi bi-file-earmark-pdf"></i> Generar PDF
                </a>
            </section>
            <section class="reporte-excel">
                <a href="/reporteExcelMensajesContacto">
                    <i class="bi bi-file-earmark-spreadsheet"></i> Generar Excel
                </a>
            </section>
        </section>
    </section>

    <div id="listado">{% partial '@listado' %}</div>
</div>

<!-- Modal: ver mensaje completo -->
<div class="modal fade" id="modal-mensaje" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="msj-asunto">Mensaje</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="mb-1"><strong>De:</strong> <span id="msj-nombre"></span></p>
                <p class="mb-3"><strong>Correo:</strong> <a id="msj-email" href="#"></a></p>
                <p class="mb-3" id="msj-texto" style="white-space: pre-wrap;"></p>
                <p class="text-muted small mb-0" id="msj-fecha"></p>
            </div>
            <div class="modal-footer">
                <a href="#" id="msj-responder" class="btn btn-outline-primary">
                    <i class="bi bi-reply-fill"></i> Responder por correo
                </a>
                <button type="button" class="btn btn-danger" id="msj-btn-eliminar">
                    <i class="bi bi-trash"></i> Eliminar
                </button>
            </div>
        </div>
    </div>
</div>

<script src="{{ '/assets/js/mensajescontacto/mensajescontacto.js'|theme }}"></script>
