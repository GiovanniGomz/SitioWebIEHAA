{% if not ajustes.automatico %}
<span><i class="bi bi-pause-circle me-1"></i> Respaldos automáticos desactivados.</span>
{% elseif ultimoAutomatico %}
<span><i class="bi bi-check-circle text-success me-1"></i> Último automático: {{ ultimoAutomatico|date('d/m/Y H:i') }}</span>
{% else %}
<span><i class="bi bi-hourglass-split me-1"></i> Todavía no se ha hecho ningún respaldo automático.</span>
{% endif %}
