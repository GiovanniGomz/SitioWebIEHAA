<div class="container documento">
    <nav class="submenu-desplazamiento mb-4">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
                <a href="{{ 'cpanel'|page }}">
                    <i class="bi bi-house-door-fill me-1"></i> IEHAA
                </a>
            </li>
            <li class="breadcrumb-item">
                <a href="/inventario-activo-fijo">Inventario de Activo Fijo</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">Listado</li>
        </ol>
    </nav>

    <h1>Inventario de Activo Fijo</h1>

    <section class="botonera align-items-start">
        <section class="reportes align-items-center">
            <section class="reporte-pdf">
                <a href="/reportePDFActivoFijo">
                    <i class="bi bi-file-earmark-pdf"></i> Reporte general (PDF)
                </a>
            </section>
            <section class="reporte-excel">
                <a href="/reporteExcelActivoFijo">
                    <i class="bi bi-file-earmark-spreadsheet"></i> Reporte general (Excel)
                </a>
            </section>

            <section class="af-reporte-responsable d-flex align-items-center gap-2">
                <select class="form-select form-select-sm" id="af-responsable" style="width: auto; min-width: 200px;">
                    <option value="">Reporte por responsable...</option>
                    {% for responsable in responsables %}
                    <option value="{{ responsable }}">{{ responsable }}</option>
                    {% endfor %}
                </select>
                <a href="#" class="btn btn-sm btn-outline-danger" id="af-responsable-pdf" title="PDF de ese responsable">
                    <i class="bi bi-file-earmark-pdf"></i>
                </a>
                <a href="#" class="btn btn-sm btn-outline-primary" id="af-responsable-excel" title="Excel de ese responsable">
                    <i class="bi bi-file-earmark-spreadsheet"></i>
                </a>
            </section>
        </section>

        <div class="">
            <button type="button" class="btn btn-primary btn-nuevo float-right" id="btnModalUp" data-bs-toggle="modal"
                data-bs-target="#modal">Nuevo bien</button>
        </div>
    </section>

    <div id="listado">{% partial '@listado' %}</div>
</div>

{% partial '@formulario' %}

<script src="{{ '/assets/js/activofijo/activofijo.js'|theme }}"></script>
{% if errorDescarga %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        Swal.fire('Aviso', {{ errorDescarga|json_encode|raw }}, 'error');
    });
</script>
{% endif %}
