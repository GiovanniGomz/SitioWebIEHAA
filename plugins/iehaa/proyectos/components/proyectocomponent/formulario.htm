<div class="container formulario-contenedor">
    <div class="modal fade" id="modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="formulario-titulo">Registrar Proyecto</h1>
                    <button type="button" class="btn-close" id="btn-close" data-bs-dismiss="modal" aria-label="Close"
                        onclick="resetear()"></button>
                </div>

                <div class="modal-body">
                    <div data-validate-error class="alert alert-danger" style="display: none">
                        <p data-message></p>
                    </div>

                    <form id="formulario" data-request="proyectoComponent::onRegistrar" data-request-validate
                        data-request-flash data-request-success="onRegistrar(data)" data-request-files
                        data-request-update="'@listado': '#listado'" enctype="multipart/form-data">

                        <input type="hidden" id="id" name="id" value="" />
                        <input type="hidden" id="quitar_archivo" name="quitar_archivo" value="" />

                        <div class="mb-3">
                            <div class="validacion">
                                <label for="titulo" class="form-label">Título</label>
                                <span data-validate-for="titulo" class="text-danger small validacion-descripcion"></span>
                            </div>
                            <input type="text" class="form-control" id="titulo" name="titulo" placeholder="Título del proyecto" />
                        </div>

                        <div class="mb-3">
                            <div class="validacion">
                                <label for="investigador_id" class="form-label">Investigador</label>
                                <span data-validate-for="investigador_id" class="text-danger small validacion-descripcion"></span>
                            </div>
                            <select class="form-select" id="investigador_id" name="investigador_id">
                                <option value="">Seleccione...</option>
                                {% for investigador in investigadores %}
                                <option value="{{ investigador.id }}">{{ investigador.nombre }} {{ investigador.apellido }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <div class="validacion">
                                <label for="descripcion" class="form-label">Resumen del proyecto</label>
                                <span data-validate-for="descripcion" class="text-danger small validacion-descripcion"></span>
                            </div>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="3"
                                placeholder="Resumen breve"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="detalle" class="form-label">Otros detalles del proyecto</label>
                            <textarea class="form-control" id="detalle" name="detalle" rows="4"
                                placeholder="Otros detalles del proyecto (opcional)"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label d-block">Documento del proyecto (opcional)</label>

                            <div id="proyecto-archivo-actual" class="mb-2 d-none">
                                <a href="#" id="proyecto-archivo-enlace" target="_blank" class="btn btn-sm btn-outline-secondary">
                                    <i class="bi bi-file-earmark-text"></i> Ver documento actual
                                </a>
                                <button type="button" class="btn btn-sm btn-outline-danger" id="btn-quitar-archivo">
                                    <i class="bi bi-x-lg"></i> Quitar
                                </button>
                            </div>

                            <label class="file-drop" for="archivo">
                                <input type="file" id="archivo" name="archivo" hidden />
                                <i class="bi bi-cloud-arrow-up"></i>
                                <span class="file-drop-text">Arrastrá el documento aquí o hacé clic para seleccionar</span>
                            </label>
                            <span data-validate-for="archivo" class="text-danger small validacion-descripcion"></span>
                        </div>

                        <button type="submit" id="btnRegistrar" class="btn btn-primary w-100">Registrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
