<div class="mb-3">
    <div class="validacion">
        <label for="nombre" class="form-label">Nombre</label>
        <span data-validate-for="nombre" class="text-danger small mb-1 validacion-descripcion"></span>
    </div>
    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Escriba el nombre del documento" />

</div>
<div class="mb-3">
    <div class="validacion">
        <label for="archivo" class="form-label">Documento</label>
        <span data-validate-for="archivo" class="text-danger small mb-1 validacion-descripcion"></span>
    </div>

    {% if actualizar %}

    <div id="contenedor-pdf" class="contenedor-pdf ocultar">
        <i class="bi bi-file-earmark-pdf-fill pdf"></i>
        <p id="pdf-descripcion"></p>
    </div>

    {% endif %}

    <input class="form-control" type="file" id="archivo" name="archivo" accept="application/pdf" />
</div>

<input type="hidden" name="id" id="id">
<input type="hidden" name="archivo_tmp" id="archivo_tmp">
