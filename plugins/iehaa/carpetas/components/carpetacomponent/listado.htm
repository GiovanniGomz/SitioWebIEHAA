<div class="contenedor-archiveros {% if carpetas|length == 0 %} d-block text-center {% endif %}">
    {% for carpeta in carpetas %}

    <div class="archivero">
        <i class="bi bi-files btnRedireccionar" data-id="{{ carpeta.url }}"></i>

        <span class="text-center">{{ carpeta.nombre }}</span>

        <div class="archivero-botonera">
            <button class="boton boton-modificar" data-bs-toggle="modal" data-bs-target="#modal"
                data-request="carpetaComponent::onGetCarpeta" data-request-data="id: {{ carpeta.id }}"
                data-request-success="cargarFormulario(data)">
                <i class="bi bi-pencil-square"></i>
            </button>

            <button type="button" class="boton boton-eliminar" data-id="{{ carpeta.id }}">
                <i class="bi bi-trash"></i>
            </button>
        </div>
    </div>

    {% else %}

    <p class="mensaje">No hay registros disponibles</p>

    {% endfor %}
</div>
