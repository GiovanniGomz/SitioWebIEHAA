<div class="contenedor-archiveros {% if estantes|length == 0 %} d-block text-center {% endif %}">

    {% for estante in estantes %}

    <div class="archivero">
        <i class="bi bi-collection btnRedireccionar" data-id="{{ estante.url }}"></i>

        <span>Estante No. {{ estante.codigo }}</span>

        <div class="archivero-botonera">
            <button class="boton boton-modificar" data-bs-toggle="modal" data-bs-target="#modal"
                data-request="estanteComponent::onGetEstante" data-request-data="id: {{ estante.id }}"
                data-request-success="cargarFormulario(data)">
                <i class="bi bi-pencil-square"></i>
            </button>

            <button type="button" class="boton boton-eliminar" data-id="{{ estante.id }}">
                <i class="bi bi-trash"></i>
            </button>
        </div>
    </div>

    {% else %}

    <p class="mensaje">No hay registros disponibles</p>

    {% endfor %}
</div>
