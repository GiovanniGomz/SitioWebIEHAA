<div class="container-fluid documento">
    <nav class="submenu-desplazamiento mb-4">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
                <a href="{{ 'cpanel'|page }}">
                    <i class="bi bi-house-door-fill me-1"></i> IEHAA
                </a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">Correspondencia</li>
        </ol>
    </nav>

    <h1>Correspondencia</h1>

    <section class="botonera">
        <section class="reportes">
            <section class="reporte-pdf">
                <a href="/reportePDFCorrespondencia">
                    <i class="bi bi-file-earmark-pdf"></i> Generar PDF
                </a>
            </section>
            <section class="reporte-excel">
                <a href="/reporteExcelCorrespondencia">
                    <i class="bi bi-file-earmark-spreadsheet"></i> Generar Excel
                </a>
            </section>
        </section>
        <div></div>
    </section>

    <div class="card mb-4">
        <div class="card-header d-flex align-items-center justify-content-between">
            <h6 class="mb-0 fw-semibold"><i class="bi bi-inbox-fill me-1 text-danger"></i> Solicitudes pendientes</h6>
        </div>
        <div class="card-body">
            {% partial '@listado_pendientes' pendientes=pendientes %}
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h6 class="mb-0 fw-semibold">Historial de correspondencia</h6>
        </div>
        <div class="card-body">
            {% partial '@listado_historial' historial=historial %}
        </div>
    </div>
</div>

{% partial '@formulario' %}

<script src="{{ '/assets/js/correspondencia/correspondencia.js'|theme }}"></script>
