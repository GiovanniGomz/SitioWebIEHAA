<div class="container formulario-contenedor">
    <div class="modal fade" id="modal-correspondencia" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="formulario-titulo">Aceptar solicitud</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" onclick="resetear()"></button>
                </div>

                <div class="modal-body">
                    <div data-validate-error class="alert alert-danger" style="display: none">
                        <p data-message class="mb-0"></p>
                    </div>

                    <div class="alert alert-secondary small d-none" id="cor-info-solicitud">
                        <div><strong id="cor-info-solicitante"></strong> — <span id="cor-info-email"></span></div>
                        <div class="mt-1"><i class="bi bi-journal-bookmark me-1"></i> <span id="cor-info-documento"></span></div>
                        <div class="text-muted"><i class="bi bi-geo-alt me-1"></i> <span id="cor-info-ubicacion"></span></div>
                        <div class="mt-1" id="cor-info-mensaje-wrap"><em id="cor-info-mensaje"></em></div>
                    </div>

                    <form id="formulario" data-request="correspondenciaComponent::onRegistrar" data-request-validate
                        data-request-flash data-request-success="onRegistrar(data)"
                        data-request-update="'@listado_pendientes': '#listado-pendientes', '@listado_historial': '#listado-historial'">

                        <input type="hidden" id="id" name="id" value="" />
                        <input type="hidden" id="solicitud_id" name="solicitud_id" value="" />

                        <div class="row">
                            <div class="mb-3 col-md-6">
                                <div class="validacion">
                                    <label for="categoria_correspondencia_id" class="form-label">Categoría de correspondencia</label>
                                    <span data-validate-for="categoria_correspondencia_id" class="text-danger small validacion-descripcion"></span>
                                </div>
                                <select class="form-select" id="categoria_correspondencia_id" name="categoria_correspondencia_id">
                                    <option value="">Seleccione...</option>
                                    {% for categoria in categorias %}
                                    <option value="{{ categoria.id }}">{{ categoria.nombre }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3 col-md-6">
                                <div class="validacion">
                                    <label for="fecha_atencion" class="form-label">Fecha y hora de atención</label>
                                    <span data-validate-for="fecha_atencion" class="text-danger small validacion-descripcion"></span>
                                </div>
                                <input type="datetime-local" class="form-control" id="fecha_atencion" name="fecha_atencion" />
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="validacion">
                                <label for="remitente" class="form-label">Remitente (nombre de quien solicita)</label>
                                <span data-validate-for="remitente" class="text-danger small validacion-descripcion"></span>
                            </div>
                            <input type="text" class="form-control" id="remitente" name="remitente" />
                        </div>

                        <div class="mb-1">
                            <div class="validacion">
                                <label for="descripcion_documento" class="form-label">Descripción del documento</label>
                                <span data-validate-for="descripcion_documento" class="text-danger small validacion-descripcion"></span>
                            </div>
                            <textarea class="form-control" id="descripcion_documento" name="descripcion_documento" rows="3"
                                placeholder="Detalle del documento entregado o prestado"></textarea>
                        </div>

                        <div class="modal-footer px-0 pb-0">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" onclick="resetear()">Cancelar</button>
                            <button type="submit" class="btn btn-primary" id="btnRegistrar">Aceptar y enviar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
