<div class="container documento">
    <nav class="submenu-desplazamiento mb-4">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">
                <a href="{{ 'cpanel'|page }}">
                    <i class="bi bi-house-door-fill me-1"></i> IEHAA
                </a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">Correspondencia</li>
        </ol>
    </nav>

    <h1>Correspondencia</h1>
    <p class="text-muted">Registro de los documentos que el instituto envía y recibe.</p>

    <section class="botonera">
        <section class="reportes">
            <section class="reporte-pdf">
                <a href="/reportePDFRegistroCorrespondencia">
                    <i class="bi bi-file-earmark-pdf"></i> Generar PDF
                </a>
            </section>
            <section class="reporte-excel">
                <a href="/reporteExcelRegistroCorrespondencia">
                    <i class="bi bi-file-earmark-spreadsheet"></i> Generar Excel
                </a>
            </section>
        </section>

        <div class="">
            <button type="button" class="btn btn-primary btn-nuevo float-right" id="btnModalUp" data-bs-toggle="modal"
                data-bs-target="#modal">Nuevo</button>
        </div>
    </section>

    <div id="listado">{% partial '@listado' %}</div>
</div>

<!-- Formulario -->
{% partial '@formulario' %}

<script src="{{ '/assets/js/registrocorrespondencia/registrocorrespondencia.js'|theme}}"></script>
{% if errorDescarga %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        Swal.fire('Aviso', {{ errorDescarga|json_encode|raw }}, 'error');
    });
</script>
{% endif %}
