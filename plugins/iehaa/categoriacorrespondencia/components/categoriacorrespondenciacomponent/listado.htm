<table class="table" id="tabla-categoria-correspondencia">
    <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Nombre</th>
            <th scope="col">Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% set contador = 1 %}
        {% for categoria in categorias %}
        <tr>
            <th scope="row">{{ contador }}</th>
            <td>{{ categoria.nombre }}</td>
            <td>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modal"
                    data-request="categoriaCorrespondenciaComponent::onGetCategoriaCorrespondencia"
                    data-request-data="id: {{ categoria.id }}" data-request-success="cargarFormulario(data)">
                    <i class="bi bi-pencil-square"></i>
                </button>
                <button type="button" class="btn btn-danger btn-eliminar" data-id="{{ categoria.id }}">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        </tr>
        {% set contador = contador + 1 %}
        {% endfor %}
    </tbody>
</table>
