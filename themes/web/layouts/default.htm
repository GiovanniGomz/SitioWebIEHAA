<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Index - OnePage Bootstrap Template</title>
        <meta name="description" content="" />
        <meta name="keywords" content="" />

        <!-- Favicons -->
        <link href="{{ 'assets/img/favicon.png'|theme}}" rel="icon" />
        <link
            href="{{ 'assets/img/apple-touch-icon.png'|theme}}"
            rel="apple-touch-icon"
        />

        <!-- Fonts -->
        <link href="https://fonts.googleapis.com" rel="preconnect" />
        <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />

        <!-- Vendor CSS Files -->
        <link
            href="{{ 'assets/vendor/bootstrap/css/bootstrap.min.css'|theme}}"
            rel="stylesheet"
        />
        <link
            href="{{ 'assets/vendor/bootstrap-icons/bootstrap-icons.css'|theme}}"
            rel="stylesheet"
        />
        <link href="{{ 'assets/vendor/aos/aos.css" rel="stylesheet'|theme}}" />
        <link
            href="{{ 'assets/vendor/glightbox/css/glightbox.min.css'|theme}}"
            rel="stylesheet"
        />
        <link
            href="{{ 'assets/vendor/swiper/swiper-bundle.min.css'|theme}}"
            rel="stylesheet"
        />

        <!-- Main CSS File -->
        <link href="{{ 'assets/css/main.css" rel="stylesheet'|theme}}" />
    </head>

    <body class="index-page">
        {% partial 'site/header' %} {% page %} {% partial 'site/footer' %}

        <!-- Scroll Top -->
        <a
            href="#"
            id="scroll-top"
            class="scroll-top d-flex align-items-center justify-content-center"
            ><i class="bi bi-arrow-up-short"></i
        ></a>

        <!-- Preloader -->
        <div id="preloader"></div>

        <!-- Vendor JS Files -->
        <script src="{{ 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js'|theme}}"></script>
        <script src="{{ 'assets/vendor/php-email-form/validate.js'|theme}}"></script>
        <script src="{{ 'assets/vendor/aos/aos.js'|theme}}"></script>
        <script src="{{ 'assets/vendor/purecounter/purecounter_vanilla.js'|theme}}"></script>
        <script src="{{ 'assets/vendor/glightbox/js/glightbox.min.js'|theme}}"></script>
        <script src="{{ 'assets/vendor/swiper/swiper-bundle.min.js'|theme}}"></script>
        <script src="{{ 'assets/vendor/imagesloaded/imagesloaded.pkgd.min.js'|theme}}"></script>
        <script src="{{ 'assets/vendor/isotope-layout/isotope.pkgd.min.js'|theme}}"></script>

        <!-- Main JS File -->
        <script src="{{ 'assets/js/main.js'|theme}}"></script>
    </body>
</html>
