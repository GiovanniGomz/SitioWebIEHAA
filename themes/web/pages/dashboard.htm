title = "Demonstration"
url = "/dashboard"
layout = "cpanel"
==

<main class="main-content">
    <div class="container-fluid px-4">

        <!-- Título -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-1">Dashboard</h4>
                <p class="text-muted small mb-0">Resumen general del sistema</p>
            </div>
            <button class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i> Nuevo
            </button>
        </div>

        <!-- Stats Cards -->
        <div class="row g-3 mb-4">
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card card-dashboard h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon bg-primary bg-opacity-10 text-primary me-3">
                            <i class="bi bi-people-fill"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Usuarios</div>
                            <div class="fs-4 fw-bold">1,248</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card card-dashboard h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon bg-success bg-opacity-10 text-success me-3">
                            <i class="bi bi-check-circle-fill"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Activos</div>
                            <div class="fs-4 fw-bold">892</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card card-dashboard h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon bg-warning bg-opacity-10 text-warning me-3">
                            <i class="bi bi-file-earmark-text-fill"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Documentos</div>
                            <div class="fs-4 fw-bold">3,456</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card card-dashboard h-100">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon bg-danger bg-opacity-10 text-danger me-3">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Alertas</div>
                            <div class="fs-4 fw-bold">12</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Aquí puedes poner tablas, gráficos, etc. -->
        <div class="card card-dashboard">
            <div class="card-header bg-white border-0 py-3">
                <h6 class="mb-0 fw-semibold">Últimos registros</h6>
            </div>
            <div class="card-body">
                <!-- Tu DataTable u otro contenido -->
                <p class="text-muted mb-0">Contenido de la tabla aquí...</p>
            </div>
        </div>

    </div>
</main>
